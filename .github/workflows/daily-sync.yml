name: SGCE Sync (Manual)

# Nota: o servidor da UTFPR (apl.utfpr.edu.br) bloqueia IPs de datacenters nos EUA
# (incluindo GitHub Actions), por isso o agendamento automático diário foi desativado
# para evitar e-mails de falha. Para atualizar o MongoDB Atlas a partir do Brasil:
#   cd frontend/utfCerts && npm run sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de sincronização (recent = ano atual e anterior | full = todos os anos)'
        required: false
        default: 'recent'
        type: choice
        options:
          - recent
          - full

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/sgceScripts/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/sgceScripts/requirements.txt

      - name: Run SGCE sync
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python -u backend/sgceScripts/sync_sgce.py --mode "${{ inputs.mode || 'recent' }}"
