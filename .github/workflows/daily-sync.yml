name: Daily SGCE Sync

on:
  schedule:
    # 06:00 UTC = 03:00 BRT (America/Sao_Paulo)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de sincronização (recent = ano atual e anterior | full = todos os anos)'
        required: false
        default: 'recent'
        type: choice
        options:
          - recent
          - full

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/sgceScripts/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/sgceScripts/requirements.txt

      - name: Run SGCE sync
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python -u backend/sgceScripts/sync_sgce.py --mode "${{ inputs.mode || 'recent' }}"
